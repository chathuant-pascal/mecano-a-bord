<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Découvre la Méthode Sans Stress Auto — Mécano à Bord</title>
<style>
  :root {
    --rouge-principal: #CC0000;
    --fond: #111111;
    --fond-cartes: #1a1a1a;
    --texte-secondaire: #cccccc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    margin: 8px 0 20px;
  }
  .video-block {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* ratio 16:9 */
    background: var(--fond-cartes);
    border: 2px solid var(--rouge-principal);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .video-block iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .video-placeholder {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--texte-secondaire);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  p.intro {
    color: var(--texte-secondaire);
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
    margin: 0 0 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Découvre la Méthode Sans Stress Auto</h1>
    <p class="intro">
      Cette courte vidéo t'explique ce que tu vas apprendre et comment
      l'application t'accompagne au quotidien.
    </p>

    <div class="video-block">
      <!--
        PASCAL : remplace VOTRE_ID_VIDEO_OPTIN par l'identifiant YouTube
        de la vidéo (réglée en "Non répertorié", pas "Public"), puis
        supprime le <div class="video-placeholder">...</div> ci-dessous.

        <iframe src="https://www.youtube.com/embed/VOTRE_ID_VIDEO_OPTIN"
                title="Découvre la Méthode Sans Stress Auto"
                allowfullscreen></iframe>
      -->
      <div class="video-placeholder">
        <span>🎬 Vidéo à venir</span>
        <span>Pascal : ajoute l'identifiant YouTube (vidéo « Non répertorié »)</span>
      </div>
    </div>
  </div>

  <script>
    // Accès hors-ligne — sans effet si le navigateur ou la WebView ne
    // supporte pas les Service Workers.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
